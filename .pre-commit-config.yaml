# Required local checks. Install both Git hook types before committing:
# pre-commit install --install-hooks --hook-type pre-commit --hook-type pre-push
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks staged secret scan (before commit)
        stages: [pre-commit]
      - id: gitleaks
        name: Gitleaks Git-history scan (before push)
        entry: gitleaks git --redact --verbose --log-opts=--all
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      - id: local-python-checks
        name: Ruff, Pyright, and Pytest (before commit and push)
        entry: bash scripts/local-checks.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
